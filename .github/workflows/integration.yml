name: Integration checks
on:
  push:
    branches:
      - 'integration/**'
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q edgemind
  webview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix webview-ui ci
      - run: npm --prefix webview-ui run build
      - run: node --check extension.js
  package-vsix:
    runs-on: ubuntu-latest
    needs: [python-tests, webview-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix webview-ui ci
      - run: npm --prefix webview-ui run build
      - run: npm install --no-save --no-package-lock @vscode/vsce
      - run: npx vsce package --no-dependencies --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: edgemind-vsix
          path: '*.vsix'
          if-no-files-found: error
